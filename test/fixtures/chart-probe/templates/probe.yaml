apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  releaseName: {{ .Release.Name | quote }}
  releaseNamespace: {{ .Release.Namespace | quote }}
  marker: {{ .Values.marker | quote }}
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  hasProbeApi: {{ .Capabilities.APIVersions.Has "probe.example.com/v1" | quote }}
